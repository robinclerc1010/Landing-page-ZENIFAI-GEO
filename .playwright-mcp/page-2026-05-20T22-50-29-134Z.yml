        - listitem [ref=e114]:
          - generic [ref=e116]: "Cas d’usage : « quel outil pour [problème concret que vous résolvez] ? »"
        - listitem [ref=e117]:
          - generic [ref=e119]: "Prestataire : « quelle agence / quel cabinet pour [votre service] ? »"
        - listitem [ref=e120]:
          - generic [ref=e122]: "Validation : « [votre marque] est-elle une bonne solution pour [besoin] ? »"
