      - heading "Comment apparaître sur ChatGPT" [level=1] [ref=e30]
      - paragraph [ref=e31]: "800 millions de personnes utilisent ChatGPT chaque semaine pour choisir un outil, un prestataire, une solution. Voici la méthode complète pour que votre marque figure dans ses réponses — sur ses deux leviers : la connaissance du modèle et ChatGPT Search."
      - generic [ref=e32]:
        - generic [ref=e33]: Publié en mai 2025
        - generic [ref=e34]: ~10 min de lecture
    - generic [ref=e36]:
      - paragraph [ref=e37]:
        - text: "ChatGPT n’est plus seulement un assistant conversationnel : c’est devenu un"
        - strong [ref=e38]: moteur de recommandation
        - text: . Quand un dirigeant demande « quel est le meilleur outil pour gérer X ? » ou « quelle agence choisir pour Y ? », ChatGPT répond par une liste courte de noms. Soit votre marque en fait partie, soit elle est absente d’une présélection que vous ne voyez jamais.
      - paragraph [ref=e39]: "Apparaître dans ces réponses, c’est l’objet du GEO (Generative Engine Optimization). Et pour ChatGPT en particulier, il faut comprendre une chose essentielle : le modèle cite les marques de deux façons très différentes."
      - figure [ref=e40]:
        - blockquote [ref=e41]: « Soit votre marque fait partie des trois ou quatre noms cités, soit elle est absente d’une présélection que votre équipe ne verra jamais. »
      - heading "Les deux façons dont ChatGPT cite une marque" [level=2] [ref=e42]
      - paragraph [ref=e43]: C’est la distinction la plus importante à saisir — et celle que la plupart des marques ignorent.
      - paragraph [ref=e44]:
        - strong [ref=e45]: 1. La connaissance d’entraînement (mémoire du modèle).
        - text: "ChatGPT a été entraîné sur un immense corpus de texte. Une marque qui y apparaît de façon récurrente et cohérente est « connue » du modèle : il peut la citer sans même faire de recherche web. C’est un levier de fond, lent à bouger, qui dépend des mentions tierces et de la cohérence de votre entité dans le temps."
      - paragraph [ref=e46]:
        - strong [ref=e47]: 2. ChatGPT Search (recherche web en direct).
        - text: "Quand la question l’exige — actualité, requête précise, demande de sources — ChatGPT lance une recherche web, lit des pages et cite ses sources sous la réponse. Ce levier se rapproche du SEO : il faut être indexé, pertinent et structuré pour l’extraction. Son avantage : l’impact d’une optimisation y est rapide."
      - paragraph [ref=e48]: Une stratégie GEO sérieuse travaille les deux. Ignorer le premier, c’est rester invisible dès que l’utilisateur ne déclenche pas de recherche. Ignorer le second, c’est manquer toutes les requêtes récentes ou précises.
      - heading "Les 3 robots d’OpenAI à autoriser" [level=2] [ref=e49]
      - paragraph [ref=e50]: OpenAI explore le web avec trois agents distincts. Chacun alimente un levier différent — et bloquer l’un d’eux, même par inadvertance, vous exclut de ce levier.
