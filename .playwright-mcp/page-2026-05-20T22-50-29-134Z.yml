            - img [ref=e149]
          - paragraph [ref=e150]: "OpenAI utilise trois robots : GPTBot (entraînement des futurs modèles), OAI-SearchBot (index de ChatGPT Search) et ChatGPT-User (navigation à la demande). Il faut les autoriser explicitement dans le fichier robots.txt. Bloquer l’un d’eux exclut votre marque du levier correspondant."
        - generic [ref=e151]:
          - button "Combien de temps avant d’apparaître dans ChatGPT ?" [ref=e152] [cursor=pointer]:
