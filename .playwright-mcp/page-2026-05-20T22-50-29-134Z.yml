      - paragraph [ref=e71]:
        - text: Ces autorisations se déclarent dans le fichier
        - code [ref=e72]: robots.txt
        - text: à la racine du site. C’est le tout premier point à vérifier d’un audit GEO.
      - heading "La méthode en 6 étapes" [level=2] [ref=e73]
      - heading "Étape 1 — Autoriser les robots d’OpenAI" [level=2] [ref=e74]
      - paragraph [ref=e75]:
        - text: Vérifiez votre
        - code [ref=e76]: robots.txt
        - text: ": GPTBot, OAI-SearchBot et ChatGPT-User doivent être explicitement autorisés. Beaucoup de sites bloquent ces agents par défaut via un plugin de sécurité ou un CDN — sans le savoir."
      - heading "Étape 2 — Consolider l’entité de marque" [level=2] [ref=e77]
      - paragraph [ref=e78]: ChatGPT ne peut recommander une marque que s’il sait précisément qui elle est. Si le nom, la description, le secteur ou les fondateurs varient entre votre site, LinkedIn, les annuaires et la presse, le modèle hésite — et une marque sur laquelle il hésite n’est pas recommandée. La consolidation d’entité aligne tous ces signaux, y compris sur Wikidata, pour donner au modèle une version unique et vérifiable.
      - heading "Étape 3 — Structurer un contenu citable" [level=2] [ref=e79]
      - paragraph [ref=e80]: ChatGPT extrait des passages, pas des pages entières. Chaque section utile doit répondre à une question précise dès sa première phrase, rester compréhensible hors contexte, et s’appuyer sur des données chiffrées avec sources liées. Le format question-réponse, les titres explicites et le schema.org rendent un contenu nettement plus citable.
      - heading "Étape 4 — Couvrir les requêtes de comparaison et d’alternative" [level=2] [ref=e81]
      - paragraph [ref=e82]: "Les questions qui déclenchent une recommandation sont presque toujours comparatives : « meilleur outil pour… », « alternative à… », « X ou Y ». Les pages de comparaison et d’alternative sont les formats que ChatGPT mobilise le plus pour construire ses shortlists. Une marque absente de ces contenus est absente de la décision."
      - heading "Étape 5 — Construire l’autorité tierce" [level=2] [ref=e83]
      - paragraph [ref=e84]: "C’est le levier qui pèse le plus sur la connaissance d’entraînement du modèle. ChatGPT « apprend » une marque à travers les sources qui en parlent : presse spécialisée, communautés, annuaires sectoriels, Wikipedia et Wikidata. Une marque uniquement présente sur son propre site reste fragile ; une marque mentionnée de façon cohérente ailleurs devient une référence stable."
      - heading "Étape 6 — Mesurer la part de voix et itérer" [level=2] [ref=e85]
      - paragraph [ref=e86]: Testez régulièrement, dans ChatGPT, un corpus de requêtes représentatives de votre marché. Notez votre fréquence de citation, les marques qui dominent les réponses et les éventuelles informations erronées. Cette mesure dans le temps — la part de voix IA — est ce qui transforme le GEO en discipline pilotable plutôt qu’en intuition.
      - heading "Pourquoi votre marque n’apparaît pas dans ChatGPT" [level=2] [ref=e87]
      - paragraph [ref=e88]: "Les causes les plus fréquentes que nous identifions en audit :"
      - list [ref=e89]:
        - listitem [ref=e90]:
          - generic [ref=e92]: Les robots d’OpenAI sont bloqués dans le robots.txt — souvent sans que l’entreprise le sache.
        - listitem [ref=e93]:
          - generic [ref=e95]: "L’entité de marque est floue : le modèle confond la marque, le produit, ou une homonymie."
        - listitem [ref=e96]:
          - generic [ref=e98]: "Le contenu est écrit pour Google : pages centrées sur les fonctionnalités, sans passages auto-suffisants ni format question-réponse."
        - listitem [ref=e99]:
          - generic [ref=e101]: Aucune page de comparaison ni d’alternative — la marque est invisible au moment de la décision.
        - listitem [ref=e102]:
          - generic [ref=e104]: "L’autorité tierce est faible : peu de mentions sur les sources que ChatGPT considère comme fiables."
      - heading "Exemples de requêtes ChatGPT à conquérir" [level=2] [ref=e105]
      - paragraph [ref=e106]: "Le travail commence par lister les questions que vos prospects posent réellement. Quelques familles types :"
